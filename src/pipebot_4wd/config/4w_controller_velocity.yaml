controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    use_sim_time: true

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

velocity_controller:
  ros__parameters:
    joints:
      - joint_front_left
      - joint_front_right
      - joint_back_left
      - joint_back_right
      
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
