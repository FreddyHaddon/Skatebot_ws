analyzers:
  ros__parameters:
    path: Aggregation
    rpi_monitor:
      type: diagnostic_aggregator/GenericAnalyzer
      path: CPU
      contains: [ 'rpi' ]
    servos:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Servos
      # This matches on the name field.
      contains: [ 'Dynamixel', 'Connected' ]
